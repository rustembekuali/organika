rt:"Нт"},alcohol:{name:"Спирттер",color:"#3b82f6",short:"Сп"},polyol:{name:"Көпатомды спирттер",color:"#2563eb",short:"Кс"},phenol:{name:"Фенолдар",color:"#8b5cf6",short:"Фн"},aldehyde:{name:"Альдегидтер",color:"#ec4899",short:"Ал"},ketone:{name:"Кетондар",color:"#db2777",short:"Кт"},acid:{name:"Карбон қышқылдары",color:"#ef4444",short:"Қш"},salt:{name:"Тұздар мен алкоголяттар",color:"#a3a3a3",short:"Тз"},ether:{name:"Жай эфирлер",color:"#06b6d4",short:"ЖЭ"},ester:{name:"Күрделі эфирлер",color:"#0ea5e9",short:"КЭ"},fat:{name:"Майлар",color:"#eab308",short:"Мй"},amine:{name:"Аминдер",color:"#6366f1",short:"Ам"},aminoacid:{name:"Аминқышқылдары",color:"#f97316",short:"Ақ"},protein:{name:"Нәруыздар",color:"#c2410c",short:"Нр"},carb:{name:"Көмірсулар",color:"#84cc16",short:"Кс"},polymer:{name:"Полимерлер",color:"#64748b",short:"Пл"},other:{name:"Басқа органикалық заттар",color:"#94a3b8",short:"Бс"},inorg:{name:"Бейорганикалық заттар",color:"#9ca3af",short:"Бо"}},ve=[{id:"alkanes",name:"Алкандар",group:"Көмірсутектер",cls:"alkane",intro:"Қаныққан ациклді көмірсутектер, жалпы формуласы CₙH₂ₙ₊₂. Барлық байланыс σ-байланыс, сондықтан тән реакциялары — орынбасу, жану және айырылу.",mistakes:["Алкандар бром суын түссіздендіреді деп ойлау: бөлме температурасында алкан бром суын түссіздендірмейді, галогендеу тек жарықта (hν) жүреді.","Вюрц реакциясында тізбек екі есе ұзаратынын ескермеу: CH₃Cl-дан метан емес, этан түзіледі.","Дюма реакциясында өнімдегі көміртек санын қате анықтау: CH₃COONa-дан CH₄ шығады, яғни бір көміртек кетеді (CO₂ ретінде Na₂CO₃ құрамында).","Пропанды галогендегенде тек 1-бромпропан түзіледі деп жазу: бромдау негізінен екіншілік көміртекте жүреді."],notes:["Төменгі алкандар көгілдір жалынмен жанады.","Алкандар KMnO₄ ерітіндісін түссіздендірмейді — алкендерден ажыратудың бір жолы."]},{id:"cycloalkanes",name:"Циклоалкандар",group:"Көмірсутектер",cls:"cycloalkane",intro:"Тұйық тізбекті қаныққан көмірсутектер, жалпы формуласы CₙH₂ₙ (алкендермен изомер). Кіші циклдар (C₃, C₄) қосылу реакциясына түседі, үлкен циклдар алкандар сияқты орынбасу реакциясына бейім.",mistakes:["Циклопропанның формуласын C₃H₈ деп жазу: цикл тұйықталғанда екі сутек кем, дұрысы C₃H₆.","Циклоалкан мен алкеннің молекулалық формуласы бірдей болғандықтан оларды бір зат деп санау (циклопропан мен пропен — класаралық изомерлер).","Циклогексан да циклопропан сияқты бромды оңай қосып алады деп ойлау: C₅–C₆ циклдары тұрақты, оларға орынбасу тән."],notes:["Бес және алты мүшелі циклоалкандар мұнай құрамында кездеседі (оларды В.В. Марковников зерттеген)."]},{id:"alkenes",name:"Алкендер",group:"Көмірсутектер",cls:"alkene",intro:"Бір C=C қос байланысы бар қанықпаған көмірсутектер, CₙH₂ₙ. π-байланыс оңай үзілетіндіктен, қосылу, тотығу және полимерлену реакциялары тән.",mistakes:["Пропенге HBr қосқанда 1-бромпропан жазу: Марковников ережесі бойынша сутек сутегі көп көміртекке қосылып, 2-бромпропан түзіледі.","Алкендердің гидратациясын «Кучеров реакциясы» деп атау: Кучеров реакциясы — алкиндердің Hg²⁺ қатысындағы гидратациясы.","Вагнер реакциясында тек этиленгликольді жазып, MnO₂ мен KOH-ты және коэффициенттерді ұмыту."],notes:["Сапалық реакциялар: бром суы мен KMnO₄ ерітіндісі түссізденеді."]},{id:"dienes",name:"Алкадиендер",group:"Көмірсутектер",cls:"diene",intro:"Екі C=C байланысы бар көмірсутектер, CₙH₂ₙ₋₂ (алкиндермен изомер). Түйіндес диендер (бутадиен-1,3, изопрен) 1,2- және 1,4-қосылуға түседі және каучуктар түзеді.",mistakes:["Бутадиен-1,3 бромды тек 1,2-жағдайда қосады деп ойлау: 1,4-қосылу да жүреді, сонда қос байланыс ортаға (2,3-жағдайға) ауысады.","Бутадиен мен бутинді молекулалық формуласы (C₄H₆) бойынша шатастыру — құрылымдық формуланы жаз."],notes:["Бром суын түссіздендіреді — сапалық реакция."]},{id:"alkynes",name:"Алкиндер",group:"Көмірсутектер",cls:"alkyne",intro:"Бір C≡C үш байланысы бар көмірсутектер, CₙH₂ₙ₋₂. Қосылу сатылап (алдымен алкенге, сосын алканға дейін) жүреді; ұштағы ≡C–H сутегі металмен орын ауыстыра алады.",mistakes:["Ацетилен гидратациясынан этанол түзіледі деп жазу: Кучеров реакциясы бойынша енол арқылы этаналь (сірке альдегиді) шығады.","Пропин гидратациясынан пропаналь жазу: Марковников ережесі бойынша ацетон (пропанон) түзіледі.","Күміс ацетиленидін барлық алкиндер береді деп ойлау: тек ұшында ≡C–H бар алкиндер (ацетилен, пропин, бутин-1) береді, бутин-2 бермейді."]},{id:"arenes",name:"Арендер",group:"Көмірсутектер",cls:"arene",intro:"Бензол сақинасы бар көмірсутектер. Ароматты жүйе тұрақты болғандықтан, бензолға орынбасу тән; қосылу тек қатаң жағдайда (H₂/кат., Cl₂/hν) жүреді.",mistakes:["Бензол бром суын түссіздендіреді деп ойлау: бензол бром суымен әрекеттеспейді, бромдау FeBr₃ катализаторымен жүреді.","Бензол KMnO₄-ті түссіздендіреді деп жазу: бензол түссіздендірмейді, ал толуол қыздырғанда түссіздендіреді (бүйір тізбек тотығады).","Толуолды хлорлау шартын шатастыру: AlCl₃/FeCl₃ катализаторымен — сақинаға, жарықта (hν) — метил тобына орынбасу жүреді.","Бензолсульфон қышқылын C₆H₆SO₃ деп жазу: дұрысы C₆H₅SO₃H."]},{id:"halo",name:"Галогентуындылар",group:"Көмірсутектердің туындылары",cls:"halo",intro:"Көмірсутектегі сутек атомдары галогенге алмасқан қосылыстар. C–Hal байланысы полюсті, сондықтан галоген оңай орын ауыстырады (гидролиз, аминдеу) немесе HHal ретінде бөлінеді (элиминация). Бұл тақырып жинақта бөлек берілмеген — реакциялар басқа бөлімдерден біріктірілді және толықтырылды.",mistakes:["Галогеналканға сілті әсерін шатастыру: сулы NaOH — спирт (орынбасу), спирттегі KOH — алкен (элиминация).","Зайцев ережесін ескермеу: HBr ажырағанда сутек сутегі аз көміртектен бөлінеді, 2-бромбутаннан негізінен бутен-2 түзіледі.","Хлорбензолдың сулы сілтімен бөлме температурасында оңай гидролизденеді деп ойлау: ол үшін жоғары температура мен қысым қажет."]},{id:"alcohols",name:"Біратомды спирттер",group:"Оттекті қосылыстар",cls:"alcohol",intro:"Құрамында бір –OH тобы бар қосылыстар. O–H байланысы бойынша (Na-мен, қышқылдармен этерификация) және C–O байланысы бойынша (HHal-мен, дегидратация) реакцияларға түседі.",mistakes:["Дегидратация шартын шатастыру: t > 140 °C — алкен (молекулаішілік), t < 140 °C — жай эфир (молекулааралық).","Екіншілік спирт тотыққанда альдегид жазу: пропанол-2 тотығып, кетон (ацетон) береді.","Спирттер сілтімен (NaOH) әрекеттеседі деп жазу: біратомды спирттер сулы сілтімен әрекеттеспейді, ал натриймен әрекеттеседі."],notes:["Этанол ашық көгілдір жалынмен жанады.","Мыс сымын қыздырып спиртке батырғанда қара CuO қайтадан қызыл мысқа айналады — біріншілік спиртке сапалық реакция."]},{id:"polyols",name:"Көпатомды спирттер",group:"Оттекті қосылыстар",cls:"polyol",intro:"Бірнеше –OH тобы бар спирттер: этиленгликоль, глицерин. Көрші OH топтары Cu(OH)₂-мен ашық көк кешен түзеді — көпатомды спирттерге сапалық реакция.",mistakes:["Cu(OH)₂-мен сапалық реакцияны тек глицеринге тән деп ойлау: этиленгликоль, глюкоза, сахароза да көк ерітінді береді (көрші OH топтары бар).","Вагнер реакциясының теңдеуін «C₂H₄ = C₂H₄(OH)₂» деп теңестірмей жазу."]},{id:"phenols",name:"Фенолдар",group:"Оттекті қосылыстар",cls:"phenol",intro:"OH тобы тікелей бензол сақинасына байланысқан қосылыстар. Сақина әсерінен O–H полюстілігі артады (фенол спирттерден күштірек қышқыл, сілтімен әрекеттеседі), ал OH тобы сақинаның 2,4,6-жағдайларын белсендіреді.",mistakes:["Фенол спирт сияқты NaOH-пен әрекеттеспейді деп ойлау: фенол сілтімен әрекеттесіп, фенолят түзеді.","Фенолды бромдағанда монобромфенол жазу: бром суымен бірден 2,4,6-трибромфенолдың ақ тұнбасы түзіледі.","Фенол көмір қышқылынан күшті деп ойлау: фенолят ерітіндісіне CO₂ жібергенде фенол бөлінеді."]},{id:"aldehydes",name:"Альдегидтер",group:"Оттекті қосылыстар",cls:"aldehyde",intro:"Құрамында –CHO тобы бар қосылыстар. Карбонил тобы оңай тотығады (күміс айна, Cu(OH)₂) және тотықсызданады (спиртке дейін), C=O байланысына нуклеофилдер қосылады.",mistakes:["Альдегид тотыққанда спирт түзіледі деп жазу: тотығу — қышқылға, тотықсыздану (H₂) — спиртке апарады.","Cu(OH)₂-мен реакцияда түсті шатастыру: көк тұнба қыздырғанда алдымен сарғаяды, кейін кірпіш-қызыл Cu₂O тұнбасына айналады.","Формальдегид күміс айна реакциясында тек 2 моль Ag береді деп санау: HCHO соңына дейін тотығып, 4 моль Ag бөлінеді."]},{id:"ketones",name:"Кетондар",group:"Оттекті қосылыстар",cls:"ketone",intro:"Карбонил тобы екі көмірсутек радикалымен байланысқан қосылыстар (R–CO–R′). Альдегидтерден айырмашылығы — әлсіз тотықтырғыштармен (Ag₂O, Cu(OH)₂) тотықпайды.",mistakes:["Ацетон күміс айна реакциясын береді деп жазу: кетондар бұл реакцияны бермейді.","Кетонды гидрлегенде біріншілік спирт жазу: кетоннан екіншілік спирт (пропанол-2) түзіледі."],notes:["Кетондар Ag₂O-ның аммиак ерітіндісімен және Cu(OH)₂-мен тотықпайды — альдегидтен ажырату белгісі."]},{id:"acids",name:"Қаныққан карбон қышқылдары",group:"Оттекті қосылыстар",cls:"acid",intro:"Құрамында –COOH тобы бар қосылыстар. Бейорганикалық қышқылдардың жалпы қасиеттерін көрсетеді (металдар, оксидтер, сілтілер, карбонаттармен), спирттермен күрделі эфир түзеді.",mistakes:["Сірке қышқылын күшті қышқыл деп санау: ол әлсіз электролит, ішінара диссоциацияланады (⇌).","Кальций ацетатының формуласын (CH₃COO)₂Na немесе CH₃COOCa деп жазу: Ca²⁺ екі зарядты, дұрысы (CH₃COO)₂Ca.","Этерификацияда судың оттегі қышқылдан емес, спирттен шығады деп ойлау: OH тобы қышқылдан, H спирттен бөлінеді."],notes:["Лакмус ерітіндісі қызыл түске боялады.","Құмырсқа қышқылының молекуласында альдегид тобы бар, сондықтан ол күміс айна реакциясын береді."]},{id:"unsat_acids",name:"Қанықпаған карбон қышқылдары",group:"Оттекті қосылыстар",cls:"acid",intro:"Радикалында C=C байланысы бар қышқылдар (акрил, олеин қышқылдары). Олар әрі қышқылдардың, әрі алкендердің қасиетін көрсетеді.",mistakes:["Акрил қышқылына HBr қосқанда Марковников ережесін механикалық қолдану: –COOH тобының әсерінен бром ұштағы көміртекке қосылады (3-бромпропан қышқылы).","KMnO₄-пен тотығуды «гидратация» деп атау: судың жай қосылуы мен екі OH тобын беретін тотығу — әртүрлі реакциялар."],notes:["Бром суын және KMnO₄ ерітіндісін түссіздендіреді (C=C байланысына сапалық реакция)."]},{id:"ethers",name:"Жай эфирлер",group:"Оттекті қосылыстар",cls:"ether",intro:"R–O–R′ құрылысты қосылыстар. Спирттердің молекулааралық дегидратациясынан немесе Вильямсон синтезінен алынады; химиялық тұрғыдан салыстырмалы түрде инертті.",mistakes:["Жай эфирді күрделі эфирмен шатастыру: жай эфирде –O–, күрделі эфирде –CO–O– тобы бар.","Диэтил эфирі мен бутанолдың молекулалық формуласы бірдей (C₄H₁₀O) екенін ескермеу — бұл класаралық изомерлер."]},{id:"esters",name:"Күрделі эфирлер",group:"Оттекті қосылыстар",cls:"ester",intro:"Карбон қышқылы мен спирттің әрекеттесуінен түзілетін R–CO–O–R′ қосылыстар. Тән реакциясы — гидролиз: қышқыл ортада қайтымды, сілтілі ортада (сабындану) қайтымсыз.",mistakes:["Сілтілік гидролизде қышқыл түзіледі деп жазу: сілтімен қышқылдың тұзы шығады.","Этерификацияны қайтымсыз деп жазу: реакция қайтымды (⇌), тепе-теңдікті ығыстыру үшін H₂SO₄ (конц.) суды байланыстырады."]},{id:"fats",name:"Майлар",group:"Оттекті қосылыстар",cls:"fat",intro:"Глицерин мен жоғары карбон қышқылдарының күрделі эфирлері (триглицеридтер). Қатты майларда қаныққан, сұйық майларда (өсімдік майы) қанықпаған қышқыл қалдықтары басым.",mistakes:["Майлардың гидролизінен тек бір молекула қышқыл түзіледі деп жазу: бір триглицеридтен 3 молекула қышқыл (немесе тұз) шығады.","Сабынды майдың қышқылдық гидролизінен алынады деп ойлау: сабын — сілтілік гидролиздің (сабынданудың) өнімі."],notes:["Майдың қанықпағандығы йод санымен анықталады: қос байланысы көп болса, йод саны жоғары.","Сұйық майды гидрлеп қатты май (маргарин негізі) алады."]},{id:"amines",name:"Аминдер",group:"Азотты қосылыстар",cls:"amine",intro:"Аммиактың органикалық туындылары. Азоттағы бөлінбеген электрон жұбы аминдерге негіздік қасиет береді: олар қышқылдармен тұз түзеді.",mistakes:["Анилин ерітіндісі лакмусты көкке бояйды деп ойлау: анилин тым әлсіз негіз, индикатор түсін өзгертпейді. Метиламин, этиламин ерітінділері көкке бояйды.","Аминдердің негіздігін салыстыруда анилинді метиламиннен күшті деп санау: бензол сақинасы азоттың электрон жұбын тартады, сондықтан анилин әлсіз.","Зинин реакциясын тотығу деп атау: нитробензолдың анилинге айналуы — тотықсыздану."]},{id:"aminoacids",name:"Аминқышқылдары",group:"Азотты қосылыстар",cls:"aminoacid",intro:"Құрамында –NH₂ және –COOH топтары бар екідайлы (амфотерлі) қосылыстар. Сілтілермен де, қышқылдармен де тұз түзеді, өзара әрекеттесіп пептидтер береді.",mistakes:["Аланин мен β-аланинді шатастыру: аланинде NH₂ тобы α-көміртекте тұр (CH₃–CH(NH₂)–COOH).","Дипептид атауын шатастыру: аланиннің COOH тобы глициннің NH₂ тобымен әрекеттессе, аланилглицин (Ala-Gly) түзіледі.","Пептидтік байланыс түзілгенде су бөлінетінін ұмыту."]},{id:"proteins",name:"Нәруыздар",group:"Азотты қосылыстар",cls:"protein",intro:"α-аминқышқылдарының қалдықтары пептидтік байланыстармен (–CO–NH–) жалғасқан биополимерлер. Нәруыздарды сапалық реакциялармен анықтайды.",mistakes:["Денатурация кезінде бірінші реттік құрылым бұзылады деп ойлау: аминқышқылдарының тізбегі сақталады, екінші, үшінші, төртінші реттік құрылымдар бұзылады.","Биурет және ксантопротеин реакцияларын шатастыру: биурет (күлгін) — пептидтік байланысқа, ксантопротеин (сары) — бензол сақинасы бар қалдықтарға."]},{id:"mono",name:"Моносахаридтер",group:"Көмірсулар",cls:"carb",intro:"Гидролизденбейтін көмірсулар (глюкоза, фруктоза). Глюкоза — альдегидоспирт: альдегид тобы бойынша тотығады/тотықсызданады, OH топтары бойынша көпатомды спирт қасиетін көрсетеді.",mistakes:["Cu(OH)₂-мен екі реакцияны шатастыру: бөлме температурасында — көк ерітінді (көпатомды спирт), қыздырғанда — қызыл Cu₂O (альдегид тобы).","Глюкоза мен фруктоза молекулалық формуласы бірдей болғандықтан бір зат деп ойлау: глюкоза — альдоза, фруктоза — кетоза.","Мыс(II) глюкозатын «мыс глюконаты» деп атау: глюконат — глюкон қышқылының тұзы."]},{id:"di",name:"Дисахаридтер",group:"Көмірсулар",cls:"carb",intro:"Гидролизденгенде екі моносахарид беретін көмірсулар: сахароза, мальтоза, лактоза (жалпы формуласы C₁₂H₂₂O₁₁).",mistakes:["Сахароза күміс айна реакциясын береді деп жазу: сахароза молекуласында бос альдегид тобы жоқ, реакция жүрмейді.","Сахарозаның гидролиз өнімдерін «2 глюкоза» деп жазу: глюкоза + фруктоза түзіледі; 2 глюкоза мальтозадан шығады."],notes:["Сахарозаны қант қызылшасынан немесе қант қамысынан алады: шырынды кальций гидроксидімен өңдеп, кальций сахаратын түзеді, кейін CO₂ жіберіп сахарозаны қайта бөледі.","Сахароза күміс айна реакциясын бермейді."]},{id:"poly",name:"Полисахаридтер",group:"Көмірсулар",cls:"carb",intro:"Көптеген моносахарид қалдықтарынан тұратын табиғи полимерлер: крахмал (α-глюкоза қалдықтары) және целлюлоза (β-глюкоза қалдықтары), (C₆H₁₀O₅)ₙ.",mistakes:["Крахмал мен целлюлоза формуласы бірдей болғандықтан құрылысы да бірдей деп ойлау: қалдықтар α- және β-формада, тізбек құрылысы әртүрлі.","Йодпен көк түсті целлюлоза да береді деп жазу: бұл — крахмалға тән сапалық реакция."],notes:["Крахмалды картоптан немесе жүгеріден алады.","Целлюлозаның негізгі көзі — ағаш."]},{id:"polymers",name:"Полимерлер",group:"Полимерлер",cls:"polymer",intro:"Көп рет қайталанатын буындардан тұратын жоғары молекулалы қосылыстар. Полимерлену кезінде қосымша өнім бөлінбейді; поликонденсацияда кіші молекулалар (су) бөлінеді. Бұл тақырып жинақтағы полимерлену реакцияларын біріктіріп, мектеп курсынан толықтырылды.",mistakes:["Полимерлену мен поликонденсацияны шатастыру: капрон ε-аминкапрон қышқылынан поликонденсация (су бөлінеді), ал капролактамнан полимерлену арқылы алынады.","Полимер буынын жазғанда қос байланысты сақтап қалу: этилен полимерленгенде буында (–CH₂–CH₂–) қос байланыс жоқ, ал диендерден алынған каучукта бір қос байланыс қалады."],notes:["Каучукты күкіртпен қыздырғанда (вулкандау) тізбектер арасында –S–S– көпірлері түзіліп, резеңке алынады."]},{id:"inorg",name:"Органикаға қажет бейорганикалық реакциялар",group:"Мектеп базасы",cls:"inorg",intro:"Органикалық реакцияларда реагент немесе сынауыш ретінде қолданылатын заттарды алу және анықтау. айланысы үзіледі; бір өнімде жаңа C=C байланысы түзіледі.",x:"Ұзын тізбекті алкан қыздырғанда екі бөлікке ыдырайды: біреуі алкан, екіншісі алкен. Крекинг арқылы мұнайдан бензин алынады.",m:"Крекинг өнімдерінің екеуін де алкан деп жазу: сутек жетпейтіндіктен бір өнім міндетті түрде алкен болады."},{id:"kolbe-ethane",t:"Кольбе электролизі: натрий ацетатынан этан",at:["alkanes:get","acids:prop"],eq:"2 sodium_acetate + 2 h2o -> c2h6 + 2 co2 + h2 + 2 naoh",c:"электролиз",ty:"ox",lv:"adv",src:3,st:"ok",nm:"kolbe",b:"Ацетат-иондағы C–COO байланысы үзіледі (CO₂ бөлінеді); екі метил радикалы арасында C–C байланысы түзіледі.",x:"Анодта ацетат-иондар электрон беріп, CO₂ бөлінеді, ал метил радикалдары қосылып этан түзеді. Катодта су тотықсызданып, H₂ мен NaOH түзіледі.",m:"Кольбе электролизін Дюма реакциясымен шатастыру: Кольбеде тізбек екі еселенеді (C₂ → C₂H₆), Дюмада бір көміртекке қысқарады.",hl:{sodium_acetate:"CC(=O)O",c2h6:"CC"}},{id:"propane-br2",t:"Пропанды бромдау",at:["alkanes:prop","halo:get"],eq:"c3h8 + br2 -> bromopropane2 + hbr",c:"hν",ty:"subst",lv:"ubt",src:3,st:"ok",trap:["bromopropane1"],b:"Екіншілік көміртектегі C–H байланысы мен Br–Br байланысы үзіледі; C–Br және H–Br байланыстары түзіледі.",x:"Радикалдық орынбасу жарықта жүреді. Бром іріктемелі әрекет етеді: тұрақтырақ екіншілік радикал түзілетіндіктен, негізгі өнім — 2-бромпропан.",m:"Негізгі өнімге 1-бромпропан жазу: ол аз мөлшерде ғана түзіледі.",hl:{c3h8:"C(C)C",bromopropane2:"C(Br)"}},{id:"ch4-cl2-1",t:"Метанды хлорлау: 1-саты",at:["alkanes:prop","halo:get"],eq:"ch4 + cl2 -> ch3cl + hcl",c:"hν",ty:"subst",lv:"base",src:3,st:"ok",b:"Бір C–H және Cl–Cl байланысы үзіледі; C–Cl және H–Cl байланыстары түзіледі.",x:"Жарық хлор молекуласын радикалдарға ыдыратады, олар метандағы сутекті бір-бірлеп ауыстырады. Бірінші сатыда хлорметан түзіледі.",m:"Хлорлау қараңғыда жүреді деп ойлау: радикалдық тізбекті бастау үшін жарық (hν) қажет.",hl:{ch4:"C",ch3cl:"CCl"}},{id:"ch4-cl2-2",t:"Метанды хлорлау: 2-саты",at:["alkanes:prop","halo:get"],eq:"ch3cl + cl2 -> ch2cl2 + hcl",c:"hν",ty:"subst",lv:"ubt",src:3,st:"ok",b:"C–H және Cl–Cl байланыстары үзіледі; екінші C–Cl байланысы түзіледі.",x:"Хлорметан да хлормен әрекеттесіп, дихлорметан береді. Сондықтан метанды хлорлағанда өнімдердің қоспасы түзіледі."},{id:"ch4-cl2-3",t:"Метанды хлорлау: 3-саты (хлороформ)",at:["alkanes:prop","halo:get"],eq:"ch2cl2 + cl2 -> chcl3 + hcl",c:"hν",ty:"subst",lv:"ubt",src:3,st:"ok",b:"C–H және Cl–Cl байланыстары үзіледі; үшінші C–Cl байланысы түзіледі.",x:"Үшінші сатыда трихлорметан (хлороформ) түзіледі. Әр сатыда бір молекула HCl бөлінеді."},{id:"ch4-cl2-4",t:"Метанды хлорлау: 4-саты",at:["alkanes:prop","halo:get"],eq:"chcl3 + cl2 -> ccl4 + hcl",c:"hν",ty:"subst",lv:"ubt",src:3,st:"ok",b:"Соңғы C–H байланысы үзіледі; төртінші C–Cl байланысы түзіледі.",x:"Метандағы барлық сутек хлорға алмасып, тетрахлорметан түзіледі. Төрт саты бойынша барлығы 4 моль Cl₂ жұмсалады."},{id:"ethane-cl2",t:"Этанды хлорлау",at:["alkanes:prop","halo:get"],eq:"c2h6 + cl2 -> c2h5cl + hcl",c:"hν",ty:"subst",lv:"base",src:0,st:"ok",b:"C–H және Cl–Cl байланыстары үзіледі; C–Cl және H–Cl байланыстары түзіледі.",x:"Этанның бір сутегі хлорға алмасып, хлорэтан түзіледі. Бұл — алканнан спиртке және басқа кластарға өтудің алғашқы сатысы.",hl:{c2h6:"CC",c2h5cl:"CCl"}},{id:"konovalov",t:"Коновалов реакциясы: этанды нитрлеу",at:["alkanes:prop"],eq:"c2h6 + hno3 -> nitroethane + h2o",c:"HNO₃ (сұйыт.), ~140 °C, p",ty:"subst",lv:"ubt",src:3,st:"fix",nm:"konovalov",b:"C–H және HO–NO₂ ішіндегі O–N байланысы үзіледі; C–N және O–H (су) байланыстары түзіледі.",x:"Алкандағы сутек нитротопқа (–NO₂) алмасады. Реакция сұйытылған азот қышқылымен қыздырып, қысыммен жүргізіледі.",m:"Алкандарды нитрлеуге бензол сияқты H₂SO₄ (конц.) қосу: Коновалов реакциясында нитрлеуші қоспа емес, сұйытылған HNO₃ қолданылады.",n:"PDF-те шарты «H₂SO₄ конц. кат» деп берілген. Коновалов реакциясы сұйытылған азот қышқылымен (≈10–20 %) қыздырып, қысыммен жүргізіледі; H₂SO₄ қатыспайды. Түзетілді.",hl:{c2h6:"CC",nitroethane:"C[N+](=O)[O-]"}},{id:"ch4-pyrolysis",t:"Метанның толық айырылуы",at:["alkanes:prop"],eq:"ch4 -> c + 2 h2",c:"1000 °C",ty:"decomp",lv:"base",src:3,st:"ok",b:"Барлық төрт C–H байланысы үзіледі; H–H байланыстары түзіледі.",x:"Ауасыз қатты қыздырғанда метан күйе (көміртек) мен сутекке ыдырайды. Бұл күйе алудың бір жолы."},{id:"ch4-ethyne",t:"Метаннан ацетилен алу",at:["alkanes:prop","alkynes:get"],eq:"2 ch4 -> ethyne + 3 h2",c:"1500 °C",ty:"decomp",lv:"base",src:3,st:"ok",b:"C–H байланыстары үзіледі; C≡C және H–H байланыстары түзіледі.",x:"Метанды 1500 °C-қа дейін тез қыздырып, лезде суытқанда ацетилен түзіледі. Бұл — ацетиленнің өнеркәсіптік алынуы.",m:"Температураларды шатастыру: 1000 °C — күйе мен сутек, 1500 °C — ацетилен.",hl:{ch4:"C",ethyne:"C#C"}},{id:"ch4-ethene",t:"Метаннан этилен алу (жинақтағы жазба)",at:["alkanes:prop"],eq:"2 ch4 -> ethene + 2 h2",c:"500 °C (жинақ бойынша)",ty:"decomp",lv:"adv",src:3,st:"check",b:"C–H байланыстары үзіледі; C=C және H–H байланыстары түзіледі.",x:"Теңдеу атомдар бойынша теңестірілген, бірақ мектеп оқулықтарында метаннан этиленді тікелей осылай алу стандартты әдіс ретінде берілмейді.",n:"Күмәнді: «500 °C» шарты мен әдістің өзі стандартты мектеп дереккөздерімен расталмады. Метан 500 °C-та іс жүзінде айырылмайды; метаннан этилен алу (тотықтырғыш қосылу) катализатор мен оттекті қажет етеді. Жаттығулар мен реакциялар картасына енгізілмеді."},{id:"ch4-partial-ox",t:"Метанның конверсиясы: жартылай тотығу",at:["alkanes:prop"],eq:"2 ch4 + o2 -> 2 co + 4 h2",c:"кат., t°",ty:"ox",lv:"adv",src:3,st:"ok",b:"C–H және O=O байланыстары үзіледі; C≡O және H–H байланыстары түзіледі.",x:"Оттек жеткіліксіз болғанда метан синтез-газға (CO + H₂) айналады. Синтез-газдан кейін метанол мен көмірсутектер алынады."},{id:"ch4-co2",t:"Метанның көмірқышқыл газбен конверсиясы",at:["alkanes:prop"],eq:"ch4 + co2 -> 2 co + 2 h2",c:"кат., t°",ty:"ox",lv:"adv",src:3,st:"ok",b:"C–H және C=O байланыстары үзіледі; C≡O және H–H байланыстары түзіледі.",x:"Метан көмірқышқыл газбен әрекеттесіп, синтез-газ береді. Мұнда CO₂ тотықтырғыш рөлін атқарады.",n:"PDF-те шарттар көрсетілмеген; катализатор мен қыздыру — бұл процестің стандартты шарттары."},{id:"ch4-h2o",t:"Метанның бу конверсиясы",at:["alkanes:prop"],eq:"ch4 + h2o -> co + 3 h2",c:"Ni, t°",ty:"ox",lv:"adv",src:3,st:"ok",b:"C–H және O–H байланыстары үзіледі; C≡O және H–H байланыстары түзіледі.",x:"Су буы мен метаннан синтез-газ алынады. Бұл — сутек өндірудің негізгі өнеркәсіптік әдісі.",n:"PDF-те шарттар көрсетілмеген; никель катализаторы мен қыздыру — стандартты шарттар."},{id:"butane-isomerization",t:"Бутанның изомерленуі",at:["alkanes:prop"],eq:"c4h10 -> isobutane",c:"AlCl₃, t°",ty:"isom",lv:"ubt",src:4,st:"ok",b:"Тізбектегі C–C байланысы қайта құрылады: тармақсыз тізбек тармақталған тізбекке айналады.",x:"Молекулалық формула өзгермейді (C₄H₁₀), тек көміртек қаңқасы өзгереді. Тармақталған алкандар бензиннің сапасын (октан санын) арттырады.",m:"Изомерленуді «C₄H₁₀ = C₄H₁₀» деп жазып, құрылымдарды көрсетпеу: изомерлерді тек құрылымдық формуламен ажыратуға болады.",hl:{c4h10:"CCCC",isobutane:"CC(C)C"}},{id:"hexane-aromatization",t:"Гександы ароматтау (риформинг)",at:["alkanes:prop","arenes:get"],eq:"c6h14 -> benzene + 4 h2",c:"Cr₂O₃ немесе Pt, t°",ty:"elim",lv:"ubt",src:7,st:"fix",b:"Тізбек ұштары арасында жаңа C–C байланысы түзіледі (тұйықталу); сегіз C–H байланысы үзіліп, ароматты сақина түзіледі.",x:"Гексан алдымен тұйықталып циклогексанға, сосын дегидрленіп бензолға айналады. Жиынтығында 4 моль H₂ бөлінеді.",m:"Гексаннан бензол алғанда 3H₂ жазу: 3H₂ циклогексаннан бензол алғанда бөлінеді, гексаннан — 4H₂.",n:"PDF-тің 4-бетінде «Риформинг» жолында сызбада циклогексан → бензол көрсетілген, ал жинақталған теңдеу «C₆H₁₄ = C₆H₆ + 3H₂» деп берілген (теңестірілмеген). 7-бетте дұрыс: C₆H₁₄ = C₆H₆ + 4H₂. Екі жазба біріктірілді.",hl:{benzene:"c1ccccc1"}},{id:"heptane-toluene",t:"Гептаннан толуол алу",at:["alkanes:prop","arenes:get"],eq:"c7h16 -> toluene + 4 h2",c:"Pt, t°",ty:"elim",lv:"ubt",src:7,st:"ok",b:"Тізбек тұйықталып, жаңа C–C байланысы түзіледі; C–H байланыстары үзіліп, ароматты сақина пайда болады.",x:"Гептанның алты көміртегі сақинаға тұйықталады, жетіншісі метил тобы болып қалады. Нәтижесінде толуол түзіледі."},{id:"ethane-dehydrogenation",t:"Этанды дегидрлеу",at:["alkenes:get","alkanes:prop"],eq:"c2h6 -> ethene + h2",c:"Pt, Pd, Ni; t°",ty:"elim",lv:"base",src:5,st:"ok",b:"Көрші көміртектердегі екі C–H байланысы үзіледі; C=C (π) және H–H байланыстары түзіледі.",x:"Алканнан сутек бөлініп, қос байланыс түзіледі. Бұл — гидрлеуге кері процесс.",hl:{c2h6:"CC",ethene:"C=C"}},{id:"ethane-ethyne",t:"Этанды ацетиленге дейін дегидрлеу",at:["alkynes:get","alkanes:prop"],eq:"c2h6 -> ethyne + 2 h2",c:"1200 °C",ty:"elim",lv:"ubt",src:6,st:"ok",b:"Төрт C–H байланысы үзіледі; C≡C және H–H байланыстары түзіледі.",x:"Жоғары температурада этаннан екі молекула сутек бөлініп, үш байланыс түзіледі."},{id:"pentane-cracking",t:"Пентанның крекингі",at:["alkenes:get","alkanes:prop"],eq:"c5h12 -> c2h6 + propene",c:"450–550 °C",ty:"decomp",lv:"base",src:5,st:"ok",b:"Тізбектегі C–C байланысы үзіледі; пропен молекуласында C=C байланысы түзіледі.",x:"Пентан крекингінде алкан мен алкен түзіледі. Бір тізбектің әртүрлі жерден үзілуінен басқа өнімдер де шығуы мүмкін."},{id:"pentane-cyclization",t:"Пентанды дегидроциклдеу",at:["cycloalkanes:get","alkanes:prop"],eq:"c5h12 -> cyclopentane + h2",c:"Cr₂O₃, 500 °C",ty:"elim",lv:"adv",src:4,st:"ok",b:"Тізбек ұштарындағы C–H байланыстары үзіледі; ұштар арасында жаңа C–C байланысы түзіліп, сақина тұйықталады.",x:"Тізбектің ұштары бір-біріне жақындап, сутек бөлінеді де, бес мүшелі сақина түзіледі."},{id:"butane-butadiene",t:"Бутаннан бутадиен-1,3 алу",at:["dienes:get","alkanes:prop"],eq:"c4h10 -> butadiene + 2 h2",c:"Cr₂O₃, Al₂O₃; t°",ty:"elim",lv:"ubt",src:5,st:"ok",b:"Төрт C–H байланысы үзіледі; екі C=C байланысы мен екі H–H байланысы түзіледі.",x:"Бутаннан екі молекула сутек бөлініп, түйіндес диен — бутадиен-1,3 түзіледі. Ол синтетикалық каучуктың мономері.",hl:{butadiene:"C=CC=C"}},{id:"isopentane-isoprene",t:"2-метилбутаннан изопрен алу",at:["dienes:get","alkanes:prop"],eq:"isopentane -> isoprene + 2 h2",c:"Cr₂O₃, t°",ty:"elim",lv:"ubt",src:5,st:"ok",b:"Төрт C–H байланысы үзіледі; екі C=C байланысы түзіледі.",x:"Изопентанды дегидрлеп, изопрен (2-метилбутадиен-1,3) алады. Изопрен — табиғи каучуктың құрылымдық буыны."},{id:"methane-combustion",t:"Метанның жануы",at:["alkanes:prop"],eq:"ch4 + 2 o2 -> co2 + 2 h2o",c:"t°",ty:"comb",lv:"base",src:0,st:"ok",ob:"Көгілдір жалын, көп жылу бөлінеді.",x:"Метан — табиғи газдың негізгі құрамдас бөлігі; ол толық жанғанда CO₂ мен су түзіледі. Реакция экзотермиялық."},{id:"propane-combustion",t:"Пропанның жануы",at:["alkanes:prop"],eq:"c3h8 + 5 o2 -> 3 co2 + 4 h2o",c:"t°",ty:"comb",lv:"base",src:4,st:"ok",ob:"Төменгі алкандар көгілдір жалынмен жанады.",x:"Пропан толық жанғанда көмірқышқыл газ бен су түзіледі. Теңестіруде алдымен C, сосын H, соңында O атомдары санайды."},{id:"butane-acetic",t:"Бутанды тотықтырып сірке қышқылын алу",at:["acids:get","alkanes:prop"],eq:"2 c4h10 + 5 o2 -> 4 acetic + 2 h2o",c:"кат., t°",ty:"ox",lv:"adv",src:14,st:"ok",b:"Тізбектің ортасындағы C–C байланысы мен C–H байланыстары үзіледі; C=O және O–H байланыстары түзіледі.",x:"Бутанның каталитикалық тотығуы кезінде тізбек ортасынан үзіліп, екі молекула сірке қышқылы түзіледі. Бұл — өнеркәсіптік әдіс."},{id:"methane-methanal",t:"Метанды тотықтырып формальдегид алу",at:["aldehydes:get","alkanes:prop"],eq:"ch4 + o2 -> methanal + h2o",c:"кат., t°",ty:"ox",lv:"ubt",src:12,st:"ok",b:"Екі C–H және O=O байланыстары үзіледі; C=O және O–H байланыстары түзіледі.",x:"Метан катализатор қатысында толық жанбай, формальдегидке дейін ғана тотығады."},{id:"cyclopropane-from-dcp",t:"1,3-дихлорпропаннан циклопропан алу",at:["cycloalkanes:get","halo:prop"],eq:"dcp13 + 2 na -> cyclopropane + 2 nacl",c:"t° (Na, Mg немесе Zn)",ty:"elim",lv:"ubt",src:4,st:"fix",nm:"wurtz",b:"Екі C–Cl байланысы үзіледі; бір молекуланың ішінде тізбек ұштары арасында C–C байланысы түзіледі.",x:"Бұл — Вюрц реакциясының молекулаішілік нұсқасы: тізбектің екі ұшындағы хлор кетіп, ұштар бір-бірімен жалғасады. Нәтижесінде сақина тұйықталады.",m:"Өнімге пропан (C₃H₈) жазу: сақина тұйықталғанда сутек қосылмайды, өнім — C₃H₆.",n:"PDF-те жинақталған теңдеу «C₃H₆Cl₂ + 2Na = C₃H₈ + 2NaCl» деп берілген. Атомдар теңестірілмеген: сызбадағы өнім — циклопропан C₃H₆. Түзетілді.",hl:{dcp13:"ClCCCCl",cyclopropane:"C1CC1"}},{id:"benzene-h2",t:"Бензолды гидрлеу",at:["cycloalkanes:get","arenes:prop"],eq:"benzene + 3 h2 -> cyclohexane",c:"Ni, t°, p",ty:"add",lv:"base",src:4,st:"ok",b:"Ароматты π-жүйе бұзылады; алты жаңа C–H байланысы түзіледі.",x:"Бензол қатаң жағдайда (катализатор, қыздыру, қысым) үш молекула сутекті қосып, циклогексанға айналады.",m:"Бензол бір молекула H₂ ғана қосады деп жазу: ароматты жүйе бөлшектеніп қосылмайды, бірден 3H₂ қосылады.",hl:{benzene:"c1ccccc1",cyclohexane:"C1CCCCC1"}},{id:"toluene-h2",t:"Толуолды гидрлеу",at:["cycloalkanes:get","arenes:prop"],eq:"toluene + 3 h2 -> mchx",c:"Ni, t°, p",ty:"add",lv:"ubt",src:8,st:"ok",b:"Сақинаның ароматты π-жүйесі бұзылады; алты жаңа C–H байланысы түзіледі.",x:"Толуолдың сақинасы бензол сияқты гидрленіп, метилциклогексан түзіледі; метил тобы өзгермейді."},{id:"cyclopropane-br2",t:"Циклопропанды бромдау (сақинаның ашылуы)",at:["cycloalkanes:prop","halo:get"],eq:"cyclopropane + br2 -> dbp13",ty:"add",lv:"ubt",src:4,st:"ok",b:"Сақинадағы бір C–C және Br–Br байланыстары үзіледі; екі C–Br байланысы түзіледі.",x:"Кернеулі үш мүшелі сақина ашылып, бром тізбектің екі ұшына қосылады. Нәтижесінде 1,3-дибромпропан түзіледі.",m:"Өнімге 1,2-дибромпропан жазу: сақина ашылғанда бром ұштағы 1- және 3-көміртекке қосылады.",hl:{cyclopropane:"C1CC1",dbp13:"BrCCCBr"}},{id:"cyclopropane-hi",t:"Циклопропанға йодсутек қосу",at:["cycloalkanes:prop","halo:get"],eq:"cyclopropane + hi -> iodopropane",ty:"add",lv:"adv",src:4,st:"ok",b:"Сақинадағы C–C және H–I байланыстары үзіледі; C–H және C–I байланыстары түзіледі.",x:"Сақина ашылып, бір ұшына сутек, екінші ұшына йод қосылады. 1-йодпропан түзіледі."},{id:"cyclohexane-cl2",t:"Циклогександы хлорлау",at:["cycloalkanes:prop","halo:get"],eq:"cyclohexane + cl2 -> chlorocyclohexane + hcl",c:"hν",ty:"subst",lv:"ubt",src:4,st:"ok",b:"C–H және Cl–Cl байланыстары үзіледі; C–Cl және H–Cl байланыстары түзіледі.",x:"Алты мүшелі сақина тұрақты, сондықтан ол ашылмайды; алкан сияқты радикалдық орынбасу жүреді.",m:"Циклогексанға циклопропан сияқты қосылу реакциясын жазу: C₅ және C₆ циклдарына орынбасу тән."},{id:"zelinsky-cyclohexane",t:"Зелинский реакциясы: циклогександы дегидрлеу",at:["cycloalkanes:prop","arenes:get"],eq:"cyclohexane -> benzene + 3 h2",c:"Pt, Pd немесе Ni; t°",ty:"elim",lv:"ubt",src:7,st:"ok",nm:"zelinsky",b:"Алты C–H байланысы үзіледі; ароматты π-жүйе және H–H байланыстары түзіледі.",x:"Циклогексан катализатор бетінде үш молекула сутек жоғалтып, бензолға айналады. Бұл — бензолды гидрлеуге кері процесс.",hl:{cyclohexane:"C1CCCCC1",benzene:"c1ccccc1"}},{id:"mchx-toluene",t:"Метилциклогександы дегидрлеу",at:["cycloalkanes:prop","arenes:get"],eq:"mchx -> toluene + 3 h2",c:"Ni, t°",ty:"elim",lv:"ubt",src:7,st:"ok",nm:"zelinsky",b:"Сақинадағы алты C–H байланысы үзіледі; ароматты сақина түзіледі.",x:"Метилциклогексанның сақинасы дегидрленіп, толуол түзіледі."},{id:"cyclohexane-combustion",t:"Циклогексанның жануы",at:["cycloalkanes:prop"],eq:"cyclohexane + 9 o2 -> 6 co2 + 6 h2o",c:"t°",ty:"comb",lv:"base",src:4,st:"ok",x:"Циклоалкандар алкандар сияқты толық жанып, CO₂ мен су береді. CₙH₂ₙ үшін CO₂ мен H₂O мольдері тең."},{id:"c2h5cl-elimination",t:"Хлорэтанды дегидрогалогендеу",at:["alkenes:get","halo:prop"],eq:"c2h5cl + koh -> ethene + kcl + h2o",c:"KOH (спирттегі ерітінді), t°",ty:"elim",lv:"base",src:5,st:"ok",rule:"zaitsev",b:"C–Cl және көрші көміртектегі C–H байланысы үзіледі; C=C байланысы түзіледі.",x:"Сілтінің спирттегі ер ons:"Al₂O₃ және ZnO катализаторлары, 400–500 °C",classes:"Спирттер → алкадиендер → каучук",memo:"«Екі спирт — бір дивинил»: 2C₂ → C₄.",confuse:"Лебедевтің екі жетістігін ажырат: бутадиенді алу (этанолдан) және бутадиенді полимерлеу (натриймен) — екі түрлі реакция.",quiz:{q:"Лебедев реакциясының өнімі қандай?",options:["этилен","диэтил эфирі","бутадиен-1,3","бензол"],answer:2,why:"Этанол бір мезгілде дегидратацияланып, дегидрленіп, бутадиен-1,3 береді."}},{id:"zinin",kind:"reaction",name:"Зинин реакциясы",scientist:"Николай Николаевич Зинин (1812–1880), орыс химигі",history:"Қазан университетінде 1842 жылы нитробензолды аммоний сульфидімен тотықсыздандырып, анилин алған. Бұл анилин-бояу өнеркәсібінің дамуына жол ашты.",scheme:"Ar–NO₂ + 6[H] → Ar–NH₂ + 2H₂O",examples:["zinin"],conditions:"Тотықсыздандырғыш: (NH₄)₂S (Зинин), Fe + HCl",classes:"Нитроқосылыстар → аминдер",memo:"«NO₂ → NH₂: оттек кетеді, сутек келеді».",quiz:{q:"Зинин реакциясы қандай процеске жатады?",options:["тотығу","тотықсыздану","гидролиз","полимерлену"],answer:1,why:"Нитротоп оттегін жоғалтып, сутек қосып алады — тотықсыздану."}},{id:"williamson",kind:"reaction",name:"Вильямсон синтезі",scientist:"Александр Уильям Уильямсон (1824–1904), ағылшын химигі",history:"Жай эфирлерді алкоголяттар мен галогеналкандардан алу әдісін 1850 жылы ұсынған; бұл эфирлердің құрылысын анықтауға көмектесті.",scheme:"R–ONa + R′–Hal → R–O–R′ + NaHal",examples:["williamson-mee","williamson-diethyl"],conditions:"Алкоголят пен галогеналкан, қыздыру",classes:"Алкоголяттар + галогеналкандар → жай эфирлер",memo:"«Алкоголят + галогеналкан = эфир + тұз».",quiz:{q:"Натрий этилаты мен хлорметаннан не түзіледі?",options:["диэтил эфирі","метилэтил эфирі","этилацетат","этанол"],answer:1,why:"Этокси-тобы метилмен жалғасып, CH₃–O–C₂H₅ түзіледі."}},{id:"fischer-tropsch",kind:"reaction",name:"Фишер–Тропш процесі",scientist:"Франц Фишер (1877–1947) және Ханс Тропш (1889–1935), неміс химиктері",history:"1925 жылы синтез-газдан (CO + H₂) сұйық көмірсутектер алудың каталитикалық әдісін жасаған.",scheme:"nCO + (2n+1)H₂ → CₙH₂ₙ₊₂ + nH₂O",examples:["fischer-tropsch-octane","co-methanation"],conditions:"Co немесе Fe катализаторлары, қыздыру, қысым",classes:"Синтез-газ → алкандар",memo:"«Сутек: 2n + 1, су: n».",quiz:{q:"Фишер–Тропш синтезі бойынша 5 моль CO-дан пентан алу үшін қанша моль H₂ қажет?",options:["5","10","11","12"],answer:2,why:"(2n + 1) = 2·5 + 1 = 11 моль H₂."}},{id:"zelinsky",kind:"reaction",name:"Зелинский реакциялары",scientist:"Николай Дмитриевич Зелинский (1861–1953), орыс химигі",history:"Циклогександы платина мен палладий бетінде дегидрлеп, бензол алуды зерттеген. Ацетилендің белсендірілген көмір бетінде тримерленуі Зелинский мен Б.А. Казанскийдің есімімен байланысты (ацетиленнен бензолды алғаш М. Бертло 1866 жылы алған). Зелинский 1915 жылы көмір противогазын ойлап тапқан.",scheme:"C₆H₁₂ →(Pt, t°) C₆H₆ + 3H₂;   3C₂H₂ →(C акт., 600 °C) C₆H₆",examples:["zelinsky-cyclohexane","mchx-toluene","ethyne-trimerization"],conditions:"Pt/Pd (дегидрлеу); белсендірілген көмір, 600 °C (тримерлеу)",classes:"Циклоалкандар, алкиндер → арендер",memo:"«Зелинский = бензолға апаратын екі жол».",confuse:"Бұл екі түрлі реакция: біріншісі — дегидрлеу, екіншісі — тримерлеу.",quiz:{q:"Ацетиленнің тримерленуі қандай катализатормен жүреді?",options:["Ni","белсендірілген көмір","AlCl₃","HgSO₄"],answer:1,why:"Ацетилен белсендірілген көмір бетінде 600 °C-та бензолға айналады."}},{id:"butlerov",kind:"reaction",name:"Бутлеров реакциясы",scientist:"Александр Михайлович Бутлеров (1828–1886), орыс химигі",history:"1861 жылы химиялық құрылыс теориясын ұсынды және сол жылы формальдегидтен қант тәрізді затты синтездеді.",scheme:"6HCHO →(Ca(OH)₂) C₆H₁₂O₆",examples:["butlerov"],conditions:"Ca(OH)₂ (әлсіз сілтілі орта)",classes:"Альдегидтер → моносахаридтер",memo:"«Алты формальдегид — бір қант».",quiz:{q:"Бутлеров реакциясының бастапқы заты қандай?",options:["ацетальдегид","формальдегид","глицерин","этанол"],answer:1,why:"Формал
